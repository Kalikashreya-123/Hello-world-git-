<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101327">
  <meta name="description" content="A little hello, wrapped in a bright and playful page.">
  <title>Hello, World! — A little good energy</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --muted: #b9bad0;
      --violet: #a98bff;
      --pink: #ff9dcf;
      --mint: #9ef3d0;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 28px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 110%, #33265c 0%, transparent 54%), #101327;
    }
    .glow { position: fixed; width: 32rem; aspect-ratio: 1; border-radius: 50%; filter: blur(100px); opacity: .2; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    .glow.one { top: -17rem; left: -10rem; background: var(--violet); }
    .glow.two { right: -15rem; bottom: -17rem; background: #ff79b9; animation-delay: -5s; }
    .card {
      position: relative;
      width: min(100%, 650px);
      padding: clamp(36px, 8vw, 76px) clamp(26px, 8vw, 72px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 32px 100px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; color: #e2d8ff; background: rgba(169,139,255,.09); font-size: .76rem; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; }
    .status { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px var(--mint); }
    .orbit { display: grid; place-items: center; width: 94px; height: 94px; margin: 35px auto 26px; border: 1px solid rgba(255,255,255,.2); border-radius: 28px; background: linear-gradient(145deg, rgba(169,139,255,.26), rgba(255,157,207,.12)); box-shadow: 0 14px 44px rgba(169,139,255,.17); transform: rotate(-7deg); }
    .orbit span { font-size: 2.9rem; transform: rotate(7deg); animation: wave 2.6s ease-in-out infinite; transform-origin: 70% 70%; }
    h1 { margin: 0; font-size: clamp(3.3rem, 10vw, 5.8rem); line-height: .98; letter-spacing: -.075em; font-weight: 780; }
    h1 span { display: block; padding: .08em 0 .16em; color: transparent; background: linear-gradient(100deg, var(--violet) 8%, #f3a8e7 52%, #ffd4a3 96%); background-clip: text; -webkit-background-clip: text; }
    .copy { max-width: 390px; margin: 21px auto 30px; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.12rem); line-height: 1.75; }
    button { display: inline-flex; align-items: center; gap: 11px; padding: 14px 21px; border: 0; border-radius: 14px; color: #211a38; background: linear-gradient(105deg, #c1aaff, #ffc0dc); box-shadow: 0 8px 28px rgba(193,170,255,.2); font: inherit; font-weight: 750; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
    button:hover { transform: translateY(-3px); box-shadow: 0 12px 34px rgba(193,170,255,.32); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .arrow { transition: transform .2s ease; }
    button:hover .arrow { transform: translateX(4px); }
    .footer { margin-top: 44px; color: #82849f; font-size: .78rem; letter-spacing: .04em; }
    .footer b { color: var(--pink); font-weight: 500; }
    .spark { position: absolute; color: #ffe0aa; opacity: .8; animation: twinkle 3s ease-in-out infinite; }
    .spark.a { top: 22%; left: 13%; font-size: 1.1rem; }
    .spark.b { top: 28%; right: 12%; color: #d5c4ff; font-size: 1.4rem; animation-delay: -1.3s; }
    .spark.c { bottom: 23%; right: 17%; font-size: .9rem; animation-delay: -.7s; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(7deg); } 10%, 25%, 40% { transform: rotate(22deg); } }
    @keyframes drift { to { transform: translate(45px, 35px) scale(1.12); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main class="card">
    <span class="spark a" aria-hidden="true">✦</span>
    <span class="spark b" aria-hidden="true">✧</span>
    <span class="spark c" aria-hidden="true">✦</span>
    <div class="eyebrow"><span class="status" aria-hidden="true"></span>A fresh little beginning</div>
    <div class="orbit" aria-hidden="true"><span>👋</span></div>
    <h1>Hello,<span>World!</span></h1>
    <p class="copy" id="message">A tiny page with a big hello. Hope your day is full of bright ideas and happy little surprises.</p>
    <button id="helloButton" type="button"><span>Send a little hello</span><span class="arrow" aria-hidden="true">→</span></button>
    <div class="footer">Made with <b>♥</b> and a little bit of code</div>
  </main>
  <script>
    const button = document.querySelector('#helloButton');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      message.textContent = 'Hello right back at you! ✨ Keep making things that make you smile.';
      button.querySelector('span').textContent = 'Hello received';
    });
  </script>
</body>
</html>
